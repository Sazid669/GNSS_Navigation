# SENSOR FUSION CONFIG FILE
frequency: 30  
sensor_timeout: 0.1
two_d_mode: true  
transform_time_offset: 0.0
print_diagnostics: true

# Frame parameters
map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: odom

# Odom data

odom0: /odom
odom0_config: [true, true, false,
              false, false, false,  
              false, false, true,  
              false, false,false,      
              false, false, false]
odom0_differential: false
odom0_queue_size: 10

# IMU data
imu0: /imu/data
imu0_config: [false, false, false, # 
              false, false, true,     
              false, false, false,  
              false, false, false] #  

imu0_differential: false
imu0_queue_size: 10
imu0_remove_gravitational_acceleration: true

# GNSS data
gnss0: /gnss
gnss0_config: [true, true, false,  # x, y
               false, false, false,
               false, false, false, 
               false, false, false,
               false, false, false]

gnss0_queue_size: 5
gnss0_differential: false
