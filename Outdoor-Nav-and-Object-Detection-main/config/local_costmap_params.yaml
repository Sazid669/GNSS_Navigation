local_costmap:
  global_frame: "odom"
  robot_base_frame: "base_link"
  update_frequency: 10.0
  publish_frequency: 5.0
  static_map: false
  rolling_window: true
  
  obstacle_range: 2.5
  inflation_radius: 0.55
  footprint: [[0.2, 0.1], [0.2, -0.1], [-0.2, -0.1], [-0.2, 0.1]]

dwa_local_planner:
  max_vel_x: 0.5
  min_vel_x: 0.1
  max_vel_theta: 1.0
  min_vel_theta: -1.0
  acc_lim_theta: 3.2
  acc_lim_x: 2.5
  acc_lim_y: 0.0
  xy_goal_tolerance: 0.2
  yaw_goal_tolerance: 0.1
  latch_xy_goal_tolerance: true
